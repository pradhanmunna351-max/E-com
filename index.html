
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settlement Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'forest-mint': '#F5F1DC', // Primary Background (Cream)
              'forest-pine': '#001A4D', // Primary Text / Deep Elements (Deep Blue)
              'forest-leaf': '#0046FF', // Primary Highlight (Electric Blue)
              'forest-sage': '#FF8040', // Secondary Highlight (Vibrant Orange)
              'forest-accent': '#E2DAB3' // Borders and Secondary Surfaces (Deep Cream)
            }
          }
        }
      }
    </script>
    <style>
      body { 
        font-family: 'Inter', sans-serif; 
        -webkit-font-smoothing: antialiased;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      
      .dark body {
        background-color: #000B1A;
        color: #F5F1DC;
      }

      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #0046FF; border-radius: 10px; }
      .dark ::-webkit-scrollbar-thumb { background: #FF8040; }
      
      input[type=number]::-webkit-inner-spin-button, 
      input[type=number]::-webkit-outer-spin-button { 
        -webkit-appearance: none; 
        margin: 0; 
      }

      .theme-transition * {
        transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease, fill 0.3s ease;
      }

      /* Custom animations for the new palette */
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      .animate-float { animation: float 6s ease-in-out infinite; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-forest-mint text-forest-pine dark:bg-[#000B1A] dark:text-forest-mint">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
